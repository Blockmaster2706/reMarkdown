name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, armv7h]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true
      
      - name: Determine next SemVer
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          majorList: '+SemVer: Major,+Semver: Major,+Major'
          minorList: '+SemVer: Minor,+Semver: Minor,+Minor'
          patchList: ''
          noVersionBumpBehavior: patch
          noNewCommitBehavior: current

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-tools-dev qttools5-dev
      
      - name: Build project for ${{ matrix.arch }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.arch }}
      
      - name: Create release archive
        run: |
          ARCH=${{ matrix.arch }}
          VERSION=${{ steps.version.outputs.version }}
          ZIP_NAME="reMarkdown-${ARCH}-${VERSION}.zip"
          cd rmd
          zip -r "../${ZIP_NAME}" backend manifest.json resources.rcc icon.png
          cd ..
          echo "ZIP_FILE=${ZIP_NAME}" >> $GITHUB_ENV
      
      - name: Create Git tag for release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.semver.outputs.next }}
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          files: ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
